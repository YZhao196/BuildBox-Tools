[pytest]
# So `python -m pytest` works from the repository root.
#
# The package lives one level down in `python/`, and pytest does not put that on
# the path by default — without this, `import buildbox` fails from here even
# though it works from inside `python/`. Both are supported; this just makes the
# root the convenient place to run from.
pythonpath = python
testpaths = python/tests
