[pytest]
# So `python -m pytest` works from the repository root, and runs both libraries.
#
# The packages live one level down, in `python/` and `management/`, and pytest
# does not put either on the path by default — without this, `import buildbox`
# fails from here even though it works from inside `python/`. Each package also
# works from its own directory; this just makes the root the convenient place to
# run everything from.
pythonpath = python
             management
testpaths = python/tests
            management/tests

# Both libraries have a `test_protocol.py`, which is the natural name in each.
# The default import mode names a test module after its file, so collecting both
# from here makes one shadow the other and the run dies at collection — while
# each suite still passes on its own, which is a confusing way to find out.
# Importlib mode identifies modules by path, so the names can stay natural.
addopts = --import-mode=importlib
